<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Maç Tahminleri</title><link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1550px;overflow:hidden;background:#070b16;
    font-family:'Inter Display','Inter',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #bg{position:absolute;inset:0;background:
    radial-gradient(120% 45% at 18% 4%, #1b2444 0%, transparent 58%),
    radial-gradient(110% 40% at 88% 98%, #201a34 0%, transparent 60%),
    linear-gradient(180deg,#080d1a,#06090f)}
  #stage{position:absolute;inset:0;padding:64px 56px 50px;display:flex;flex-direction:column}

  .kicker{font-size:26px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:#8fa2c9;text-align:center}
  h1{font-size:52px;font-weight:900;letter-spacing:-.02em;text-align:center;margin:10px 0 6px}
  .subtitle{font-size:24px;font-weight:600;color:#8393b8;text-align:center;margin-bottom:26px}

  .day{font-size:21px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:#7fd6a8;margin:14px 0 8px}
  .row{padding:12px 0 14px;border-bottom:1px solid #ffffff12}
  .teams{display:flex;align-items:center;gap:12px}
  .side{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .side.a{flex-direction:row-reverse;text-align:right}
  .sq{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:17px;font-weight:900}
  .nm{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffcf40;
    padding:0 6px;flex:none}
  .note{font-size:20px;font-weight:500;color:#94a3c4;line-height:1.35;margin-top:8px}

  #foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font-size:22px;font-weight:700;color:#4c5c82;letter-spacing:.08em}
</style></head>
<body>
<div id="bg"></div>
<div id="stage">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div class="subtitle" id="subtitle"></div>
  <div id="list"></div>
</div>
<div id="foot"></div>
<script>
(function(){
  const D=window.__DATA, $=(id)=>document.getElementById(id);
  $('kicker').textContent = D.kicker || 'HAFTANIN TAHMİNLERİ';
  $('title').textContent = D.title || '';
  $('subtitle').textContent = D.subtitle || '';
  $('foot').textContent = D.handle || '';

  const list = $('list');
  let lastDay = null;
  for (const m of (D.matches || [])) {
    if (m.day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'day';
      d.textContent = m.day;
      list.appendChild(d);
      lastDay = m.day;
    }
    const badge = (t) => `<div class="sq" style="background:linear-gradient(150deg,${t.primary},${t.secondary})">${t.short}</div>`;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="teams">
        <div class="side">${badge(m.home)}<div class="nm">${m.home.name}</div></div>
        <div class="sc">${m.home.score}-${m.away.score}</div>
        <div class="side a">${badge(m.away)}<div class="nm">${m.away.name}</div></div>
      </div>
      <div class="note">${m.note || ''}</div>`;
    list.appendChild(row);
  }

  window.__ready = true;
})();
</script></body></html>
