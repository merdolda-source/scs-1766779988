<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Masa</title><link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0a1410;
    font-family:'Inter Display','Inter',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #bg{position:absolute;inset:0;
    background:radial-gradient(90% 55% at 50% 18%,#1c3324 0%,#0a1410 62%),
      radial-gradient(70% 40% at 50% 100%,#132018 0%,transparent 70%)}
  /* faint pitch-line motif, purely decorative and generic - no real venue */
  #pitch{position:absolute;left:0;right:0;bottom:0;height:900px;opacity:.10;
    background:
      linear-gradient(#fff 2px,transparent 2px) 0 0/100% 90px,
      radial-gradient(circle at 50% 100%,transparent 130px,#fff 132px,#fff 134px,transparent 136px)}

  #table{position:absolute;left:50%;bottom:640px;width:840px;height:260px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(60% 100% at 50% 30%,#3a2a1c,#1d140c 78%);
    box-shadow:0 40px 90px #000a, inset 0 4px 0 #ffffff10}

  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;opacity:0}
  .head{width:172px;height:172px;border-radius:50%;position:relative;
    box-shadow:0 18px 40px #0008, inset 0 3px 0 #ffffff22}
  .hair{position:absolute;left:0;right:0;top:-14px;height:96px;border-radius:50% 50% 40% 40%/60% 60% 30% 30%}
  .face{position:absolute;inset:22px 18px 18px;border-radius:50%;background:#e7b78c}
  .eyes{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center;gap:34px}
  .eyes i{width:11px;height:11px;border-radius:50%;background:#1a1208;display:block}
  .mouth{position:absolute;left:50%;top:112px;transform:translateX(-50%);width:52px;height:8px;
    border-radius:6px;background:#5c2f22;transition:height .05s linear,top .05s linear}
  .mouth.open{height:26px;top:104px;border-radius:12px 12px 16px 16px}
  .jersey{margin-top:-30px;width:210px;height:110px;border-radius:38px 38px 20px 20px;
    box-shadow:0 14px 30px #0007, inset 0 3px 0 #ffffff20;z-index:-1}
  .tag{margin-top:14px;text-align:center}
  .name{font-size:30px;font-weight:900;letter-spacing:-.01em}
  .role{font-size:19px;font-weight:700;color:#9fb0a0;text-transform:uppercase;letter-spacing:.10em;margin-top:2px}

  .seat.speaking .head{box-shadow:0 0 0 8px #ffcf4066,0 18px 40px #0008}
  .seat.speaking .name{color:#ffcf40}

  .whistle{position:absolute;right:-8px;bottom:8px;width:34px;height:34px;border-radius:50%;
    background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 4px 10px #0007}

  /* Solid band under the captions so a character sitting further forward can
     safely overlap it without the text ever colliding with a name tag. */
  #capbar{position:absolute;left:0;right:0;bottom:0;height:420px;
    background:linear-gradient(180deg,transparent,#0a1410cc 45%,#0a1410 75%)}

  #cap{position:absolute;left:50px;right:50px;bottom:150px;text-align:center;opacity:0}
  #cap .who{font-size:26px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  #cap .line{font-size:38px;font-weight:800;line-height:1.28;text-shadow:0 4px 20px #000c}

  #foot{position:absolute;left:0;right:0;bottom:48px;text-align:center;
    font-size:26px;font-weight:700;color:#5c7a68;letter-spacing:.08em;opacity:0}
</style></head>
<body>
<div id="bg"></div><div id="pitch"></div>
<div id="table"></div>
<div id="seats"></div>
<div id="capbar"></div>
<div id="cap"><div class="who" id="capWho"></div><div class="line" id="capLine"></div></div>
<div id="foot"></div>
<script>
(function(){
  const D=window.__DATA, $=(id)=>document.getElementById(id);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
  const outCubic=(x)=>1-Math.pow(1-x,3);
  const outBack=(x)=>1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2);

  $('foot').textContent = D.handle || '';

  // Layout is fixed and hand-placed (not data-driven) - five seats, coach at
  // the head of the table, the forward largest and closest to camera per the
  // brief ("ileri ucta Osimhen patron"). Purely geometric/flat-shape avatars -
  // no photo reference is used or possible in this pipeline, so likeness is
  // limited to name tag + jersey colour, never a real photo or traced face.
  const seatsEl = $('seats');
  const els = {};
  for (const c of D.cast) {
    const el = document.createElement('div');
    el.className = 'seat';
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.transform = `translate(-50%,-50%) scale(${c.scale})`;
    el.innerHTML = `
      <div class="head" style="background:${c.skin}">
        <div class="hair" style="background:${c.hair};${c.hairStyle || ''}"></div>
        <div class="eyes"><i></i><i></i></div>
        <div class="mouth"></div>
        ${c.coach ? '<div class="whistle">🎽</div>' : ''}
      </div>
      <div class="jersey" style="background:linear-gradient(160deg,${c.jerseyA},${c.jerseyB})"></div>
      <div class="tag"><div class="name">${c.name}</div><div class="role">${c.role}</div></div>`;
    seatsEl.appendChild(el);
    els[c.key] = el;
  }

  const items = D.items || [];
  // Prefer the caller's total (built against the exact mixed-audio length)
  // over recomputing from items, so the video's frame count and the audio
  // track never drift apart - see chat-drama's index.html for the same fix.
  const rawEnd = D.totalDuration || (items.length ? Math.max(...items.map((it) => it.at + it.dur)) : 1);
  const lastAt = rawEnd + 0.4;
  const T = { seatsIn: [0, 1.1], foot: [lastAt + 0.3, lastAt + 0.9], end: lastAt + 2.6 };

  function seek(t) {
    const s = outCubic(p(t, T.seatsIn[0], T.seatsIn[1]));
    for (const key in els) {
      els[key].style.opacity = String(clamp(s * 2, 0, 1));
      const base = els[key].dataset.scale || 1;
    }
    // Re-apply per-seat transform each frame (opacity above is the only
    // shared animation - position/scale stays put once seated).
    for (const c of D.cast) {
      const e = els[c.key];
      const pop = (1 - s) * 30;
      e.style.transform = `translate(-50%,-50%) translateY(${pop}px) scale(${c.scale})`;
    }

    let current = null;
    for (const it of items) {
      const active = t >= it.at && t < it.at + it.dur;
      const el = els[it.speakerKey];
      if (!el) continue;
      if (active) {
        current = it;
        el.classList.add('speaking');
        // Cheap puppet-mouth: toggle open/closed a few times a second while
        // this line's audio is playing, closed the rest of the time. Not
        // real lip sync (no phoneme data), just enough motion to read as
        // "talking" rather than a static photo.
        const mouth = el.querySelector('.mouth');
        mouth.classList.toggle('open', Math.floor((t - it.at) * 7) % 2 === 0);
      } else {
        el.classList.remove('speaking');
        el.querySelector('.mouth').classList.remove('open');
      }
    }

    if (current) {
      $('cap').style.opacity = '1';
      $('capWho').textContent = current.name || '';
      $('capWho').style.color = current.color || '#ffcf40';
      $('capLine').textContent = current.text || '';
    } else {
      $('cap').style.opacity = '0';
    }

    $('foot').style.opacity = String(p(t, T.foot[0], T.foot[1]));
  }

  seek(0);
  window.__scene = { duration: T.end, seek, beats: items.map((it) => it.at), meta: { lines: items.length } };
})();
</script></body></html>
