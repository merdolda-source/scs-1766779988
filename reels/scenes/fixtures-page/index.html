<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Haftanın Programı</title><link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1400px;overflow:hidden;background:#070b16;
    font-family:'Inter Display','Inter',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #bg{position:absolute;inset:0;background:
    radial-gradient(120% 45% at 18% 4%, #1b2444 0%, transparent 58%),
    radial-gradient(110% 40% at 88% 98%, #201a34 0%, transparent 60%),
    linear-gradient(180deg,#080d1a,#06090f)}
  #stage{position:absolute;inset:0;padding:60px 56px 50px;display:flex;flex-direction:column}

  .kicker{font-size:26px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:#8fa2c9;text-align:center}
  h1{font-size:56px;font-weight:900;letter-spacing:-.02em;text-align:center;margin:12px 0 34px}

  .day{font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:#7fd6a8;margin:16px 0 10px}
  .row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff12}
  .side{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .side.a{flex-direction:row-reverse;text-align:right}
  .sq{width:48px;height:48px;border-radius:13px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:18px;font-weight:900}
  .nm{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{font-size:26px;font-weight:800;color:#ffcf40;font-variant-numeric:tabular-nums;
    padding:0 14px;flex:none;min-width:110px;text-align:center}

  #foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font-size:22px;font-weight:700;color:#4c5c82;letter-spacing:.08em}
</style></head>
<body>
<div id="bg"></div>
<div id="stage">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <div id="list"></div>
</div>
<div id="foot"></div>
<script>
(function(){
  const D=window.__DATA, $=(id)=>document.getElementById(id);
  $('kicker').textContent = D.kicker || 'SÜPER LİG';
  $('title').textContent = D.title || '';
  $('foot').textContent = D.handle || '';

  const list = $('list');
  let lastDay = null;
  for (const m of (D.matches || [])) {
    if (m.day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'day';
      d.textContent = m.day;
      list.appendChild(d);
      lastDay = m.day;
    }
    const badge = (t) => `<div class="sq" style="background:linear-gradient(150deg,${t.primary},${t.secondary})">${t.short}</div>`;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="side">${badge(m.home)}<div class="nm">${m.home.name}</div></div>
      <div class="tm">${m.time}</div>
      <div class="side a">${badge(m.away)}<div class="nm">${m.away.name}</div></div>`;
    list.appendChild(row);
  }

  window.__ready = true;
})();
</script></body></html>
