<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Maç Tahminleri</title><link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#070b16;
    font-family:'Inter Display','Inter',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  #bg{position:absolute;inset:0;background:
    radial-gradient(120% 55% at 18% 6%, #1b2444 0%, transparent 58%),
    radial-gradient(110% 50% at 88% 94%, #201a34 0%, transparent 60%),
    linear-gradient(180deg,#080d1a,#06090f)}

  /* ---- intro card ---- */
  #intro{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 80px;text-align:center}
  #intro .kicker{font-size:32px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8fa2c9}
  #intro h1{font-size:76px;font-weight:900;letter-spacing:-.02em;margin:16px 0 22px;line-height:1.05}
  #intro p{font-size:32px;font-weight:600;color:#9fb0d0;line-height:1.4;max-width:820px}

  /* ---- per-match card ---- */
  #cards{position:absolute;inset:0}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 64px;text-align:center;opacity:0}
  .day{font-size:28px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7fd6a8;margin-bottom:26px}
  .idx{font-size:24px;font-weight:800;color:#5c6c92;letter-spacing:.08em;margin-bottom:14px}
  .teams{display:flex;align-items:center;gap:28px;margin-bottom:8px}
  .team{display:flex;flex-direction:column;align-items:center;gap:14px;width:280px}
  .sq{width:110px;height:110px;border-radius:28px;display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:900;box-shadow:0 20px 50px #0009, inset 0 3px 0 #ffffff28}
  .nm{font-size:32px;font-weight:800;line-height:1.15}
  .sc{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#ffcf40}
  .note{margin-top:38px;font-size:34px;font-weight:600;color:#c3cfe8;line-height:1.45;max-width:840px}

  #dots{position:absolute;left:0;right:0;bottom:230px;display:flex;justify-content:center;gap:12px}
  #dots i{width:10px;height:10px;border-radius:50%;background:#2a3654;display:block}

  #foot{position:absolute;left:0;right:0;bottom:180px;text-align:center;
    font-size:29px;font-weight:700;color:#61729a;letter-spacing:.08em;opacity:0}
</style></head>
<body>
<div id="bg"></div>
<div id="intro">
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</div>
<div id="cards"></div>
<div id="dots"></div>
<div id="foot"></div>
<script>
(function(){
  const D=window.__DATA, $=(id)=>document.getElementById(id);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
  const outCubic=(x)=>1-Math.pow(1-x,3);
  const outBack=(x)=>1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2);

  $('kicker').textContent = D.kicker || 'HAFTANIN TAHMİNLERİ';
  $('title').textContent = D.title || '';
  $('subtitle').textContent = D.subtitle || '';
  $('foot').textContent = D.handle || '';

  const matches = D.matches || [];
  const INTRO_DUR = 2.3, HOLD = 2.6, GAP = 0.15;
  const T = { intro: [0, INTRO_DUR] };

  const cardsEl = $('cards');
  const dotsEl = $('dots');
  const cards = matches.map((m, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    const badge = (t) => `<div class="sq" style="background:linear-gradient(150deg,${t.primary},${t.secondary})">${t.short}</div>`;
    el.innerHTML = `
      <div class="idx">MAÇ ${i + 1} / ${matches.length}</div>
      <div class="day">${m.day || ''}</div>
      <div class="teams">
        <div class="team">${badge(m.home)}<div class="nm">${m.home.name}</div></div>
        <div class="sc">${m.home.score}-${m.away.score}</div>
        <div class="team">${badge(m.away)}<div class="nm">${m.away.name}</div></div>
      </div>
      <div class="note">${m.note || ''}</div>`;
    cardsEl.appendChild(el);

    const dot = document.createElement('i');
    dotsEl.appendChild(dot);

    return el;
  });

  let cursor = INTRO_DUR + 0.4;
  const windows = matches.map(() => {
    const at = cursor;
    cursor += HOLD + GAP;
    return at;
  });
  const lastAt = windows.length ? windows[windows.length - 1] + HOLD : INTRO_DUR;
  const T2 = { foot: [lastAt + 0.3, lastAt + 0.9], end: lastAt + 2.6 };

  function seek(t) {
    const introK = 1 - p(t, T.intro[1] - 0.35, T.intro[1]);
    $('intro').style.opacity = String(t < T.intro[1] ? 1 : Math.max(0, introK));
    $('intro').style.display = t < T.intro[1] + 0.4 ? 'flex' : 'none';

    cards.forEach((el, i) => {
      const a = windows[i], b = a + HOLD;
      const kIn = outBack(p(t, a, a + 0.4));
      const kOut = p(t, b - 0.3, b);
      const visible = t >= a - 0.05 && t < b + 0.05;
      el.style.display = visible ? 'flex' : 'none';
      el.style.opacity = String(clamp((t >= a ? kIn : 0) * (1 - kOut) * 2, 0, 1));
      el.style.transform = `translateY(${(1 - Math.min(1, kIn)) * 30}px) scale(${0.94 + Math.min(1, kIn) * 0.06})`;
      dotsEl.children[i].style.background = (t >= a && t < b) ? '#ffcf40' : '#2a3654';
      dotsEl.children[i].style.transform = (t >= a && t < b) ? 'scale(1.3)' : 'scale(1)';
    });

    $('dots').style.opacity = String(t >= T.intro[1] && t < lastAt + HOLD ? 1 : 0);
    $('foot').style.opacity = String(p(t, T2.foot[0], T2.foot[1]));
  }

  seek(0);
  window.__scene = { duration: T2.end, seek, meta: { matches: matches.length } };
})();
</script></body></html>
